[package]
name = "givmedroppedboxes"
version = "0.1.0"
edition = "2024"

[features]
loopdebug = []

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures = "0.3"
ratatui = "0.30"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = [
    "rustls",
    "stream",
    "cookies",
    "form",
    "json",
    "system-proxy",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "fs",
    "io-util",
    "sync",
    "time",
    "signal",
] }
tokio-util = "0.7"
tui-tree-widget = "0.24"
url = "2"
percent-encoding = "2"

[profile.release]
lto = "thin"
